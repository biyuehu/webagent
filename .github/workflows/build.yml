name: Build

on:
  push:
    branches: [main]
    paths:
      - "**.ts"
      - "**.json"
      - "**.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.ts"
      - "**.json"
      - "**.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install

      - name: Check formatting
        run: bun fix && git diff --exit-code

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
